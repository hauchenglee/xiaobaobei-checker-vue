name: Build and Deploy Vue

on:
  workflow_dispatch:
  push:
    branches:
      - main  # 当代码推送到 main 分支触发

jobs:
  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      # Step 1: 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: 登录 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3: Generate tag
      - name: Generate tag
        id: tag
        run: |
          TAG=$(date +'%Y-%m-%d')-${{ github.run_number }}
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # Step 4: 构建 Docker 镜像
      - name: Build Docker image
        run: docker build -t hauchenglee/xiaobaobei-checker-vue:${{ env.TAG }} .

      # Step 5: 推送 Docker 镜像到 Docker Hub
      - name: Push Docker image to Docker Hub
        run: docker push hauchenglee/xiaobaobei-checker-vue:${{ env.TAG }}

  deploy-to-centos:
    name: Deploy to CentOS Server
    runs-on: ubuntu-latest
    needs: build-and-push-docker  # 依赖上一个任务完成后再执行

    steps:
      # Step 1: 使用 SSH 部署到远程服务器
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOSTNAME }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            cd /opt/xiaobaobei-server

            upsert_env_var() {
              key="$1"
              value="$2"

              touch .env
              if [ -s .env ] && [ -n "$(tail -c 1 .env)" ]; then
                printf "\n" >> .env
              fi

              if grep -q "^${key}=" .env; then
                sed -i "s|^${key}=.*|${key}=${value}|" .env
              else
                printf "%s=%s\n" "$key" "$value" >> .env
              fi
            }

            upsert_env_var "VUE_CHECKER_VERSION" "${{ needs.build-and-push-docker.outputs.tag }}"
            
            # 檢查修改結果 (選用)
            grep "VUE_CHECKER_VERSION" .env
            
            # 重啟服務
            docker compose pull vue1
            docker compose up -d --no-deps vue1
            docker compose up -d --no-deps caddy
            docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
